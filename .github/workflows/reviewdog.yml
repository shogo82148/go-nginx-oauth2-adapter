name: reviewdog
on: [pull_request]

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1
      - name: golangci-lint
        uses: reviewdog/action-golangci-lint@v2.10.2
        with:
          reporter: github-pr-review
          github_token: ${{ github.token }}
          level: warning
