name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies for building nginx and h2o
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre3 libpcre3-dev
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      # - name: restore h2o binary
      #   uses: actions/cache@v5
      #   with:
      #     path: .github/h2o
      #     key: ${{ runner.os }}-h2o-${{ hashFiles('.github/install-h2o.sh') }}

      - name: restore nginx binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .github/nginx
          key: ${{ runner.os }}-nginx-${{ hashFiles('.github/install-nginx.sh') }}

      # FIXME: h2o doesn't work with OpenSSL v3.
      # - name: install h2o for test
      #   run: .github/install-h2o.sh

      - name: install nginx for test
        run: .github/install-nginx.sh

      - name: download dependencies
        run: go mod download
      - name: Test
        run: |
          make test

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Check GoReleaser configure
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
